<app-schedule-header></app-schedule-header>
<form #myForm="ngForm" (ngSubmit)="addSchedule(myForm)">
  <div class="form-add">
    <label for="time" class="form-add-label required" id="time">Thời gian bắt đầu:</label>
    <input id="time" [(ngModel)]="newSchedule.startTime" name="time" class="form-control form-control-datetime" required
      type="datetime-local" />
  </div>
  <div class="form-add">
    <label for="time" class="form-add-label required" id="time">Thời gian kết thúc:</label>
    <input id="time" [(ngModel)]="newSchedule.endTime" name="time" class="form-control form-control-datetime" required
      type="datetime-local" />
  </div>

  <!-- <div class="form-add">
    <label for="device" class="form-add-label required">Thiết bị:</label>
    <select [(ngModel)]="selectedDevice" name="device" class="form-select form-select-device" required
      (ngModelChange)="onSelectChange()">
      <option class="device-name" *ngFor="let device of devices" [ngValue]="device">{{device.name}}
      </option>
    </select>
  </div> -->

  <div class="form-add">
    <label for="action" class="form-add-label required">Thao tác:</label>
    <select [(ngModel)]="newSchedule.action" name="action" class="form-select" required>
      <option class="device-name" *ngFor="let act of [true,false]" [ngValue]="act">{{turnOnOff[act.toString()]}}
      </option>
    </select>
  </div>

  <!-- <div class="form-add">
    <label for="value" class="form-add-label">Địa điểm:</label>
    <select [(ngModel)]="newSchedule.value" name="action">
      <option *ngFor="let value of values" [ngValue]="value.pos">{{value.name}}
      </option>
    </select>
  </div> -->
  <div class="form-add">
    <label for="value" class="form-add-label">Thiết bị:</label>
    <select class="form-select" [(ngModel)]="newSchedule.device" name="action">
      <option *ngFor="let device of devices" [ngValue]="device.id">{{device.name}}
      </option>
    </select>
  </div>
  <div class="form-add">
    <label for="value" class="form-add-label">Giá trị:</label>
    <select class="form-select" [(ngModel)]="newSchedule.value" name="action">
      <option *ngFor="let value of values" [ngValue]="value.pos">{{value.name}}
      </option>
    </select>
  </div>
  <div class="form-check checkbox-repeat">
    <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" (click)="checkboxChange()">
    <label class="form-check-label" for="flexCheckDefault">
      Lặp lại
    </label>
  </div>
  <div class="row g-2 checkbox-repeat">
    <div class="col-1">
      <input type="checkbox" class="btn-check" id="btncheck1" autocomplete="off" (click)="monChange()" [disabled]="!isRepeat">
      <label class="btn btn-outline-primary w-100" for="btncheck1">Thứ 2</label>
    </div>
    <div class="col-1">
      <input type="checkbox" class="btn-check" id="btncheck2" autocomplete="off" (click)="tueChange()" [disabled]="!isRepeat">
      <label class="btn btn-outline-primary w-100" for="btncheck2">Thứ 3</label>
    </div>
    <div class="col-1">
      <input type="checkbox" class="btn-check" id="btncheck3" autocomplete="off" (click)="wedChange()" [disabled]="!isRepeat">
      <label class="btn btn-outline-primary w-100" for="btncheck3">Thứ 4</label>
    </div>
    <div class="col-1">
      <input type="checkbox" class="btn-check" id="btncheck4" autocomplete="off" (click)="thuChange()" [disabled]="!isRepeat">
      <label class="btn btn-outline-primary w-100" for="btncheck4">Thứ 5</label>
    </div>
    <div class="col-1">
      <input type="checkbox" class="btn-check" id="btncheck5" autocomplete="off" (click)="friChange()" [disabled]="!isRepeat">
      <label class="btn btn-outline-primary w-100" for="btncheck5">Thứ 6</label>
    </div>
    <div class="col-1">
      <input type="checkbox" class="btn-check" id="btncheck6" autocomplete="off" (click)="satChange()" [disabled]="!isRepeat">
      <label class="btn btn-outline-primary w-100" for="btncheck6">Thứ 7</label>
    </div>
    <div class="col-1">
      <input type="checkbox" class="btn-check" id="btncheck7" autocomplete="off" (click)="sunChange()" [disabled]="!isRepeat">
      <label class="btn btn-outline-primary w-100" for="btncheck7">Chủ nhật</label>
    </div>
  </div>



  <button type="submit" class="btn btn-primary form-add-sub" [(ngModel)]="addSchedule">Thêm lịch hoạt động</button>
</form>
