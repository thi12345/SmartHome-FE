<app-device-header></app-device-header>
<form #myForm="ngForm" (ngSubmit)="onSubmit(myForm)">
    <div class="form-update">
        <label for="name" class="form-update-label" id="name">Tên thiết bị:</label>
        <input id="name" [(ngModel)]="newDevice.name" name="name" class="form-control" required />
    </div>
    <div class="form-update">
        <label for="category" class="form-update-label">Loại thiết bị:</label>
        <select [(ngModel)]="newDevice.category.id" name="category" class="form-select" required>
            <option class="category-name" *ngFor="let category of categories" [ngValue]="category.id">{{category.name}}
            </option>
        </select>
    </div>

    <div class="form-update">
        <label for="description" class="form-update-label">Mô tả:</label>
        <input id="description" [(ngModel)]="newDevice.description" class="form-control" name="description" />
    </div>

    <div class="form-update">
        <label for="energy" class="form-update-label">Mức năng lượng (W):</label>
        <input id="energy" [(ngModel)]="newDevice.energy" class="form-control form-control-length" name="energy"
            type="number" />
    </div>


    <div class="form-update">
        <label for="energy" class="form-update-label">Giá trị tắt (nhập 1 giá trị):</label>
        <input id="energy" class="form-control form-control-length" name="valueOff" [(ngModel)]="offValue">
    </div>

    <div class="form-update">
        <label class="form-update-label">Các giá trị bật (cách nhau bởi dấu phẩy):</label>
        <input id="energy" class="form-control form-control-length" name="valueOn" [(ngModel)]="onValueString">
    </div>

    <div class="button">
        <button class="btn btn-primary" type="submit">Cập nhật</button>
        <button class="btn btn-secondary btn-left" type="button" (click)="onCancel()">Hủy bỏ</button>
    </div>

</form>
