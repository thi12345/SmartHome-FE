<app-category-header></app-category-header>
<form #myForm="ngForm" (ngSubmit)="onSubmit(myForm)">
    <div class="form-update">
        <label for="name" class="form-update-label" id="name">Tên loaị thiết bị:</label>
        <input id="name" [(ngModel)]="newCategory.name" name="name" class="form-control" required />
    </div>
    <div class="form-update">
        <label for="name" class="form-update-label" id="name">Mô tả:</label>
        <input id="name" [(ngModel)]="newCategory.feedKey" name="name" class="form-control" required />
    </div>
    <div class="button">
        <button class="btn btn-primary" type="submit">Cập nhật</button>
        <button class="btn btn-secondary btn-left" type="button" (click)="onCancel()">Hủy bỏ</button>
    </div>

</form>
